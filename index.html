<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barómetro de adopción de IA — Divino</title>
<meta name="description" content="Formulario de calibración del proceso de adopción de IA en Divino.">
<meta name="robots" content="noindex">
<!-- [PENDIENTE] confirmar el nombre exacto del favicon en /assets/ del repo del sitio
<link rel="icon" href="/assets/favicon.ico"> -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700;800&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --violet-deep:#4B2C7A; --violet-main:#6A3FA0; --violet-mid:#8B5CC7;
  --violet-soft:#C4A8E0; --violet-pale:#EDE6F6; --violet-ghost:#F7F3FC;
  --amber:#F2A93B; --amber-light:#FAD38A; --amber-pale:#FEF3DC;
  --ink:#1A1A1A; --ink-sec:#5F6368; --ink-muted:#9AA0A6;
  --border:#E0E0E0; --surface:#FAFAFA; --white:#FFFFFF;
  --shadow-sm:0 2px 8px rgba(74,44,122,0.08);
  --shadow-md:0 4px 20px rgba(74,44,122,0.13);
  --radius:12px;
  /* gradación de los cinco peldaños, del más pálido al más profundo */
  --step-1:#EDE6F6; --step-2:#C4A8E0; --step-3:#8B5CC7; --step-4:#6A3FA0; --step-5:#4B2C7A;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Raleway',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-weight:400; color:var(--ink); background:var(--violet-ghost);
  line-height:1.6; font-size:16px;
  min-height:100vh; min-height:100dvh;
}
.script{font-family:'Dancing Script',cursive;font-weight:600}

/* ---------- layout ---------- */
.shell{max-width:720px;margin:0 auto;padding:0 20px 120px}
header.bar{
  position:sticky;top:0;z-index:20;background:var(--violet-ghost);
  padding:16px 0 12px;border-bottom:1px solid var(--border);
  margin-bottom:28px;
}
.bar-inner{max-width:720px;margin:0 auto;padding:0 20px}
.bar-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.bar-title{font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--violet-main)}
.bar-count{font-size:.8rem;color:var(--ink-sec);font-weight:500;white-space:nowrap;text-align:right}
.track{height:6px;background:var(--violet-pale);border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--violet-mid),var(--violet-main));border-radius:99px;transition:width .35s cubic-bezier(.4,0,.2,1)}

/* ---------- tipografía ---------- */
h1{font-size:1.9rem;font-weight:800;line-height:1.2;letter-spacing:-.02em;margin-bottom:8px;color:var(--violet-deep)}
h2.q{font-size:1.4rem;font-weight:700;line-height:1.3;letter-spacing:-.01em;margin-bottom:6px}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--violet-mid);margin-bottom:12px}
.hint{color:var(--ink-sec);font-size:.95rem;margin-bottom:20px}
p{margin-bottom:14px}
strong{font-weight:700}

/* ---------- intro ---------- */
.intro-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:28px 26px;margin-bottom:20px}
.intro-card h1{margin-bottom:18px}
.intro-card p{color:var(--ink-sec)}
.intro-card p strong{color:var(--ink)}
.privacy{background:var(--amber-pale);border-left:4px solid var(--amber);border-radius:0 var(--radius) var(--radius) 0;padding:18px 20px;margin:20px 0}
.privacy p:last-child{margin-bottom:0}
.timebox{display:inline-flex;align-items:center;gap:8px;background:var(--violet-pale);color:var(--violet-deep);font-weight:600;font-size:.9rem;padding:8px 14px;border-radius:99px}

/* ---------- pantallas ---------- */
.screen{display:none;animation:in .3s ease}
.screen.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- opciones ---------- */
.opts{display:flex;flex-direction:column;gap:10px;margin-bottom:8px}
.opt{
  display:flex;align-items:flex-start;gap:13px;
  background:var(--white);border:2px solid var(--border);border-radius:var(--radius);
  padding:15px 17px;cursor:pointer;transition:border-color .15s,background .15s,box-shadow .15s;
  -webkit-tap-highlight-color:transparent;
}
.opt:hover{border-color:var(--violet-soft);background:var(--violet-ghost)}
.opt.sel{border-color:var(--violet-main);background:var(--violet-pale);box-shadow:var(--shadow-sm)}
.opt input{position:absolute;opacity:0;width:0;height:0}
.mark{
  flex:0 0 22px;width:22px;height:22px;margin-top:1px;
  border:2px solid var(--ink-muted);background:var(--white);
  display:flex;align-items:center;justify-content:center;transition:all .15s;
}
.mark.radio{border-radius:50%}
.mark.check{border-radius:6px}
.opt.sel .mark{border-color:var(--violet-main);background:var(--violet-main)}
.mark::after{content:'';opacity:0;transition:opacity .15s}
.mark.radio::after{width:8px;height:8px;border-radius:50%;background:var(--white)}
.mark.check::after{width:5px;height:10px;border:solid var(--white);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.opt.sel .mark::after{opacity:1}
.opt-txt{flex:1;font-size:1rem;line-height:1.45}
.opt-txt .sub{display:block;font-size:.85rem;color:var(--ink-sec);margin-top:3px}

/* ---------- campos de texto ---------- */
input[type=text],input[type=email],textarea{
  width:100%;font-family:inherit;font-size:1rem;color:var(--ink);
  background:var(--white);border:2px solid var(--border);border-radius:var(--radius);
  padding:13px 15px;transition:border-color .15s;
}
input[type=text]:focus,input[type=email]:focus,textarea:focus{outline:none;border-color:var(--violet-main)}
textarea{resize:vertical;min-height:92px;line-height:1.5}
label.fl{display:block;font-weight:600;font-size:.9rem;margin-bottom:7px;color:var(--ink)}
.field{margin-bottom:18px}
.otro-wrap{margin:2px 0 0 35px;display:none}
.otro-wrap.on{display:block;animation:in .2s ease}

/* pedido de ejemplo */
.ejemplo{
  display:none;background:var(--amber-pale);border:2px solid var(--amber-light);
  border-radius:var(--radius);padding:16px 18px;margin-top:14px;
}
.ejemplo.on{display:block;animation:in .25s ease}
.ejemplo label{display:block;font-weight:700;font-size:.92rem;margin-bottom:4px}
.ejemplo .why{font-size:.83rem;color:var(--ink-sec);margin-bottom:10px}
.ejemplo input{border-color:var(--amber-light);background:var(--white)}

/* ---------- matriz ---------- */
.matriz-head{background:var(--violet-pale);border-radius:var(--radius);padding:17px 19px;margin-bottom:22px;font-size:.95rem;color:var(--violet-deep)}
.grupo{font-size:.75rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--violet-mid);margin:24px 0 12px;padding-bottom:7px;border-bottom:2px solid var(--violet-pale)}
.grupo:first-of-type{margin-top:0}
/* acordeón: una pregunta abierta a la vez */
.item{background:var(--white);border:2px solid var(--border);border-radius:var(--radius);margin-bottom:10px;transition:border-color .15s;scroll-margin-top:100px}
.item.open{border-color:var(--violet-main);box-shadow:var(--shadow-sm)}
.item-head{
  display:flex;align-items:flex-start;gap:12px;width:100%;padding:14px 16px;
  font-family:inherit;text-align:left;background:none;border:0;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.item-head:focus-visible{outline:3px solid var(--violet-soft);outline-offset:2px;border-radius:var(--radius)}
.estado{flex:0 0 22px;height:22px;margin-top:1px;border-radius:50%;border:2px dashed var(--ink-muted);display:flex;align-items:center;justify-content:center}
.item.done .estado{border:2px solid var(--violet-main);background:var(--violet-main)}
.item.done .estado::after{content:'';width:5px;height:10px;border:solid var(--white);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.item-txt{flex:1;font-size:.97rem;line-height:1.4;color:var(--ink)}
.item-resp{display:block;font-size:.8rem;font-weight:700;color:var(--violet-main);margin-top:3px}
.item-resp:empty,.item.open .item-resp{display:none}
.chev{flex:0 0 auto;width:9px;height:9px;margin:6px 4px 0 0;border:solid var(--ink-muted);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .2s}
.item.open .chev{transform:rotate(-135deg);margin-top:10px}
.item-body{display:none;padding:0 16px 16px 50px}
.item.open .item-body{display:block;animation:in .2s ease}

.escala{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.escala.tres{grid-template-columns:repeat(3,1fr)}
.escala.invalid .esc{border-color:#E6B3AE}
.uso{margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.chips:last-child{margin-bottom:0}
.sub-lbl{font-size:.85rem;font-weight:700;color:var(--ink);margin:2px 0 8px}
.esc,.chip{
  font-family:inherit;font-size:.82rem;line-height:1.25;font-weight:500;color:var(--ink-sec);
  background:var(--surface);border:2px solid var(--border);border-radius:9px;
  padding:9px 5px;cursor:pointer;text-align:center;transition:all .15s;
  -webkit-tap-highlight-color:transparent;
}
.chip{padding:8px 13px}
.esc:hover,.chip:hover{border-color:var(--violet-soft)}
.esc.sel,.chip.sel{background:var(--violet-main);border-color:var(--violet-main);color:var(--white);font-weight:600}
.bar-count .mprog{display:block;font-weight:700;color:var(--violet-main);font-size:.78rem}

/* ---------- navegación ---------- */
.nav{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:var(--white);border-top:1px solid var(--border);
  padding:14px 20px calc(14px + env(safe-area-inset-bottom));
  box-shadow:0 -2px 16px rgba(74,44,122,.07);
}
.nav-inner{max-width:720px;margin:0 auto;display:flex;gap:12px;align-items:center}
button.btn{
  font-family:inherit;font-size:1rem;font-weight:700;border:none;border-radius:99px;
  padding:14px 30px;cursor:pointer;transition:all .18s;-webkit-tap-highlight-color:transparent;
}
.btn.primary{background:var(--violet-main);color:var(--white);flex:1;box-shadow:var(--shadow-sm)}
.btn.primary:hover{background:var(--violet-deep);box-shadow:var(--shadow-md)}
.btn.primary:disabled{background:var(--violet-soft);cursor:not-allowed;box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink-sec);padding:14px 18px;font-weight:600}
.btn.ghost:hover{color:var(--violet-main)}
.aviso{color:#B3261E;font-size:.88rem;font-weight:600;margin-top:10px;display:none}
.aviso.on{display:block}

/* ---------- errores de validación ---------- */
input.invalid,textarea.invalid{border-color:#B3261E;background:#FFF8F7}
.opts.invalid .opt{border-color:#E6B3AE}
.item.invalid{border-color:#B3261E;background:#FFF8F7}
.chips.invalid .chip{border-color:#E6B3AE}
.chips + .err{margin:-8px 0 12px}
.err{color:#B3261E;font-size:.86rem;font-weight:600;margin-top:7px}
.opts + .err{margin:-2px 0 12px}

/* ---------- resultado ---------- */
.card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:24px 24px;margin-bottom:18px}
.card h3{font-size:1.05rem;font-weight:800;margin-bottom:10px;color:var(--violet-deep)}
.paso{background:var(--amber-pale);border-left:4px solid var(--amber);border-radius:0 var(--radius) var(--radius) 0;padding:20px 22px;margin-bottom:18px}
.paso h3{font-size:.8rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-sec);margin-bottom:8px}
.paso p{font-size:1.05rem;line-height:1.55;margin:0}
/* el recorrido: los cinco peldaños explicados */
.escalera{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.escalera li{display:flex;gap:12px;align-items:flex-start}
.lad-sw{flex:0 0 16px;height:16px;border-radius:5px;margin-top:3px}
.lad-txt{font-size:.95rem;line-height:1.4;color:var(--ink)}
.lad-desc{display:block;color:var(--ink-sec);font-size:.87rem;margin-top:1px}
/* dónde estás: tramos proporcionales al rango de cada peldaño, con marca */
.posicion{position:relative;margin:26px 0 6px}
.tramos{display:flex;gap:3px;height:14px}
.tramo{border-radius:4px;opacity:.35}
.tramo.here{opacity:1}
.tramo.next{opacity:.65}
.pin{position:absolute;top:-9px;width:4px;height:32px;background:var(--ink);border-radius:2px;transform:translateX(-50%);box-shadow:0 0 0 2px var(--white)}
.tramo-nums{display:flex;gap:3px;margin-top:7px}
.tramo-nums span{font-size:.75rem;font-weight:700;color:var(--ink-muted);text-align:center}
.tramo-nums span.here{color:var(--violet-deep)}
.donde{font-size:1.02rem;margin:14px 0 0}
.opc{font-weight:600;font-size:.75rem;color:var(--ink-muted);margin-left:6px}
.field.abierta{margin-top:26px}
.field.abierta .hint{margin-bottom:10px}
.envio{font-size:.85rem;color:var(--ink-sec);text-align:center;padding:12px}
.envio.err{color:#B3261E;font-weight:600}

@media(max-width:560px){ .bar-long{display:none} }
@media(max-width:480px){
  h1{font-size:1.55rem}
  h2.q{font-size:1.2rem}
  .shell{padding:0 16px 120px}
  .bar-inner{padding:0 16px}
  .intro-card{padding:22px 19px}
  .item-body{padding:0 14px 14px}
}
</style>
</head>
<body>

<header class="bar" id="bar" hidden>
  <div class="bar-inner">
    <div class="bar-top">
      <span class="bar-title">Barómetro<span class="bar-long"> de adopción de IA</span></span>
      <span class="bar-count" id="count"></span>
    </div>
    <div class="track"><div class="fill" id="fill"></div></div>
  </div>
</header>

<main class="shell" id="shell"></main>

<nav class="nav" id="nav">
  <div class="nav-inner">
    <button class="btn ghost" id="back" hidden>Atrás</button>
    <button class="btn primary" id="next">Empezar</button>
  </div>
</nav>

<script>
/* ==========================================================================
   BARÓMETRO DE ADOPCIÓN DE IA — DIVINO
   Contenido: talleres/divino_adopcionia_2026/6.1_barometro.md (fuente de verdad)
   El cálculo corre entero en el navegador. El HTML es público y no contiene
   ninguna respuesta.
   ========================================================================== */

/* Endpoint del Google Apps Script desplegado como web app.
   Con la constante vacía el formulario funciona igual y guarda en localStorage. */
const ENDPOINT = "https://script.google.com/macros/s/AKfycby9d2H8mrarN-8ljW3xDh6SJDCVl3pWkrW0dQynUIoo2T85_osLnKYvMRbp2tuyhd4/exec";

/* ---------- contenido de las preguntas ---------- */

const OTRA = {t:"Otra — contanos cuál", v:0, otra:true};

/* Por dónde se usa cada chat. La IA que viene dentro de productos de trabajo
   (Rovo, Adobe, Qlik) queda afuera: el acceso lo da el producto. */
const SUPERFICIES = {
  "ChatGPT":            ["Navegador","App de escritorio","App del celular","Codex, con acceso a mis archivos"],
  "Gemini":             ["Navegador","App del celular","Dentro de Gmail, Drive o Docs"],
  "Claude":             ["Navegador","App de escritorio","App del celular","Claude Code o Cowork, con acceso a mis archivos"],
  "Copilot":            ["Navegador o app de escritorio","Dentro de Outlook","Dentro de Word, Excel o Teams","App del celular"],
  "Meta AI o WhatsApp": ["WhatsApp","Instagram o Facebook","Navegador"],
  "Grok":               ["Dentro de X","Navegador","App del celular"],
  "DeepSeek":           ["Navegador","App del celular"],
  "__otra":             ["Navegador","App de escritorio","App del celular","Dentro de otro programa"]
};
const CUENTAS = [{t:"De Divino"},{t:"Personal gratis",personal:true},{t:"Personal paga",personal:true}];

const Q = [

/* 1 · nombre, correo, área y cargo en una sola pantalla */
{id:"identidad", tipo:"campos", eyebrow:"Vamos a conocernos",
  t:"¿Quién sos y dónde trabajás?",
  hint:"Con estos datos te vamos a poder identificar, junto a tu nivel del barómetro. Es importante que uses el mismo correo cuando repitas el formulario al cierre del proceso: es lo que une las dos respuestas.",
  campos:[
    {id:"nombre", label:"Nombre y apellido", ph:"Nombre y apellido", ac:"name", cap:"words"},
    {id:"mail",   label:"Tu correo", ph:"tu@correo.com", mail:true, ac:"email", cap:"off"},
    {id:"area",   label:"Área", ph:"Como la dirías vos", ac:"organization", cap:"sentences",
      err:"Escribí tu área para seguir."},
    {id:"cargo",  label:"Cargo", ph:"Como lo dirías vos", ac:"organization-title", cap:"sentences",
      err:"Escribí tu cargo para seguir."}
  ]},

/* 2 · P3 frecuencia — sin opción abierta: las opciones cubren el espacio de días */
{id:"p3", tipo:"radio", eyebrow:"Tu semana", dim:"frecuencia",
  t:"La semana pasada, ¿cuántos días abriste una IA para algo del trabajo?",
  ops:[{t:"0 días",v:0},{t:"1 día",v:1},{t:"2 o 3 días",v:2},{t:"4 días",v:3},{t:"Los 5",v:4}]},

/* 3 · P4 profundidad */
{id:"p4", tipo:"multi", eyebrow:"Tu último mes", dim:"profundidad",
  t:"¿Cuáles de estas cosas hiciste con IA en el último mes?",
  hint:"Marcá todas las que apliquen.",
  ops:[
    {t:"Hacerle preguntas, como a un buscador tipo Google",v:1,
      sigue:{id:"p4_google", t:"Comparada con Google, ¿cómo te resulta?",
        ops:["Me responde mejor","Responde parecido, y me gusta más","Prefiero Google"]}},
    {t:"Traducir o corregir un texto",v:1},
    {t:"Resumir un documento largo",v:1},
    {t:"Redactar un mail o un informe",v:2},
    {t:"Analizar una planilla o un conjunto de datos",v:2},
    {t:"Preparar una presentación completa",v:2},
    {t:"Pensar una decisión conversando con la IA",v:3},
    {t:"Armar algo que se ejecuta solo cada vez que hace falta",v:4},
    OTRA
  ],
  ejemplo:{cuando:v=>v>=3, label:"Contá en una línea qué hiciste.",
    why:"Un ejemplo concreto sostiene lo que marcaste.", ph:"Una línea alcanza"}},

/* 4 · P5 configuración */
{id:"p5", tipo:"radio", eyebrow:"Cómo la tenés armada", dim:"configuracion",
  t:"¿Creaste alguna vez un proyecto o espacio con instrucciones que reutilizás?",
  ops:[
    {t:"No sé qué es eso",v:0},
    {t:"Sé qué es y todavía no lo usé",v:1},
    {t:"Lo probé una vez",v:2},
    {t:"Tengo uno o dos proyectos que uso",v:3},
    {t:"Tengo varios armados con instrucciones y documentos, los uso siempre",v:4},
    OTRA
  ],
  ejemplo:{cuando:v=>v>=3, label:"Nombrá uno de tus proyectos y para qué lo usás.",
    why:"Un ejemplo concreto sostiene lo que marcaste.", ph:"Nombre del proyecto y para qué"}},

/* 5 · P6 diagnóstico */
{id:"p6", tipo:"radio", eyebrow:"Cuando algo sale mal", dim:"diagnostico",
  t:"La IA te devuelve algo que sirve poco. ¿Qué hacés habitualmente?",
  ops:[
    {t:"Lo descarto y lo hago a mano",v:0},
    {t:"Le vuelvo a pedir lo mismo, a ver si sale mejor",v:1},
    {t:"Le explico qué estuvo mal y le pido que lo corrija",v:2},
    {t:"Le doy más contexto o un ejemplo de cómo lo quiero, y vuelvo a pedir",v:3},
    {t:"Le pregunto qué información le falta para hacerlo bien",v:4},
    OTRA
  ]},

/* 6 · P7 verificación */
{id:"p7", tipo:"radio", eyebrow:"Antes de usarlo", dim:"verificacion",
  t:"¿Qué hacés con las respuestas que te devuelve la IA antes de usarlas en tu trabajo?",
  ops:[
    {t:"En general, las uso como vienen",v:0},
    {t:"Les ajusto la redacción",v:1},
    {t:"Las reviso con lo que sé del tema",v:2},
    {t:"Verifico los datos contra la fuente",v:3},
    {t:"Le pido a la IA que muestre de dónde salió cada cosa, y lo chequeo",v:4},
    OTRA
  ],
  ejemplo:{cuando:v=>v>=3, label:"Contá la última vez que encontraste un error así.",
    why:"Un ejemplo concreto sostiene lo que marcaste.", ph:"Qué encontraste y cómo"}},

/* 7 · P8 matriz */
{id:"p8", tipo:"matriz", eyebrow:"Conceptos y prácticas",
  t:"¿Cuánto sabés sobre estos conceptos de IA?",
  head:"Para cada uno, contanos si sabés qué es. Si lo conocés, marcá cuánto lo usás.",
  subProgreso:()=>`${Object.keys(R.p8||{}).length} de 15 preguntas`,
  /* dos tiempos: «Sé qué es» abre la pregunta de uso. Valores 0 a 3, iguales a antes */
  escala:{
    no:{t:"No sé qué es",v:0},
    si:{t:"Sé qué es"},
    usoLbl:"¿Cuánto lo usás?",
    uso:[{t:"Nunca",v:1},{t:"Alguna vez",v:2},{t:"Habitualmente",v:3}]
  },
  nombreFila:{10:"Skills",11:"Conectores o MCP",12:"Agentes"},
  grupos:[
    {g:"Configuración de la herramienta", filas:[
      "Instrucciones tuyas guardadas a nivel de cuenta, que aplican a todas tus conversaciones",
      "Proyectos o espacios con su propio contexto y sus propios archivos",
      "Formatos de respuesta guardados, para que conteste siempre con la estructura que preferís",
      "Criterio para decidir qué archivo va al proyecto y cuál va solo al chat"

function herramientasConDetalle(){
  const marcadas = R.p13||[];
  return Object.keys(SUPERFICIES).filter(n=>marcadas.includes(n));
}
function nombreHerr(n){ return n==="__otra" ? (R.p13_otra||"Otra herramienta") : n }
function detalleCompleto(n){ const d=(R.det||{})[n]; return !!(d && d.sup.length && d.cuenta!==undefined) }
function resumenDetalle(n){
  const d = R.det[n];
  return SUPERFICIES[n].filter(s=>d.sup.includes(s)).join(", ") + " · " + CUENTAS[d.cuenta].t;
}

const $ = s => document.querySelector(s);
const shell = $("#shell"), nav = $("#nav"), bar = $("#bar");
const btnNext = $("#next"), btnBack = $("#back");

/* ---------- render ---------- */

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function render(){
  window.scrollTo(0,0);
  const V = visibles(), T = V.length;
  bar.hidden = (paso===0 || paso>T);
  if(paso===0) return renderIntro();
  if(paso>T) return renderResultado();
  const q = V[paso-1];
  renderPregunta(q);
  actualizarContador(q);
  btnBack.hidden = false;
  btnNext.textContent = paso===T ? "Ver mi resultado" : "Siguiente";
  nav.hidden = false;
}

/* barra: pasos. Segunda línea: preguntas dentro del paso, cuando hay más de una */
function actualizarContador(q){
  const T = visibles().length;
  $("#fill").style.width = (paso/T*100)+"%";
  $("#count").innerHTML = `Paso ${paso} de ${T}`
    + (q.subProgreso ? `<span class="mprog">${esc(q.subProgreso())}</span>` : "");
}

function renderPregunta(q){
  let h = `<div style="padding-top:6px">`;
  if(q.eyebrow) h += `<div class="eyebrow">${esc(q.eyebrow)}</div>`;
  h += `<h2 class="q">${esc(q.t)}</h2>`;
  if(q.hint) h += `<p class="hint">${esc(q.hint)}</p>`;
  else h += `<div style="height:14px"></div>`;

  if(q.tipo==="campos") h += bloqueCampos(q);
  if(q.tipo==="texto")  h += bloqueTexto(q);
  if(q.tipo==="largo")  h += bloqueLargo(q);
  if(q.tipo==="radio")  h += bloqueOps(q,"radio");
  if(q.tipo==="multi")  h += q.grupos ? bloqueHerramientas(q) : bloqueOps(q,"check");
  if(q.tipo==="matriz") h += bloqueMatriz(q);
  if(q.tipo==="detalle") h += bloqueDetalle(q);

  if(q.ejemplo) h += `
    <div class="ejemplo" id="ej">
      <label for="ej-in">${esc(q.ejemplo.label)}</label>
      <div class="why">${esc(q.ejemplo.why)}</div>
      <input type="text" id="ej-in" placeholder="${esc(q.ejemplo.ph)}" value="${esc(R[q.id+"_ejemplo"]||"")}">
    </div>`;

  h += `<div class="aviso" id="aviso"></div></div>`;
  shell.innerHTML = h;
  cablear(q);
}

function bloqueCampos(q){
  return q.campos.map(c=>`<div class="field">
    <label class="fl" for="c-${c.id}">${esc(c.label)}</label>
    <input type="${c.mail?"email":"text"}" id="c-${c.id}" placeholder="${esc(c.ph)}"
      value="${esc(R[c.id]||"")}" autocomplete="${c.ac}"
      autocapitalize="${c.cap}" spellcheck="false"></div>`).join("");
}

function bloqueTexto(q){
  return `<div class="field"><input type="text" id="in" placeholder="${esc(q.ph)}"
    value="${esc(R[q.id]||"")}" autocomplete="off"></div>`;
}
function bloqueLargo(q){
  return `<div class="field"><textarea id="in" placeholder="${esc(q.ph)}">${esc(R[q.id]||"")}</textarea></div>`;
}

function bloqueOps(q,tipo){
  const sel = R[q.id];
  let h = `<div class="opts">`;
  q.ops.forEach((op,i)=>{
    const on = tipo==="radio" ? sel===i : Array.isArray(sel)&&sel.includes(i);
    h += `<label class="opt${on?" sel":""}" data-i="${i}">
      <span class="mark ${tipo}"></span>
      <span class="opt-txt">${esc(op.t)}</span></label>`;
    if(op.otra) h += `<div class="otro-wrap${on?" on":""}" id="ow-${i}">
      <input type="text" id="otro-${i}" placeholder="Escribí cuál" value="${esc(R[q.id+"_otra"]||"")}"></div>`;
    if(op.sigue){                      // pregunta que se abre al marcar esta opción
      const sv = R[op.sigue.id];
      h += `<div class="otro-wrap${on?" on":""}" id="sg-${i}">
        <div class="sub-lbl">${esc(op.sigue.t)}</div>
        <div class="chips" data-sigue="${i}">${op.sigue.ops.map((t,k)=>
          `<button type="button" class="chip${sv===k?" sel":""}" data-k="${k}">${esc(t)}</button>`).join("")}</div></div>`;
    }
  });
  return h+`</div>`;
}

function bloqueHerramientas(q){
  const sel = R[q.id]||[];
  const nin = R[q.id+"_ninguna"]===true;
  let h = `<div id="tools">`;
  q.grupos.forEach(gr=>{
    h += `<div class="grupo">${esc(gr.g)}</div><div class="opts">`;
    gr.ops.forEach(name=>{
      const on = sel.includes(name);
      h += `<label class="opt tool${on?" sel":""}" data-name="${esc(name)}">
        <span class="mark check"></span><span class="opt-txt">${esc(name)}</span></label>`;
    });
    h += `</div>`;
  });
  h += `<div class="opts" id="tools-fin" style="margin-top:22px">
    <label class="opt tool${sel.includes("__otra")?" sel":""}" data-name="__otra">
      <span class="mark check"></span><span class="opt-txt">${esc(OTRA.t)}</span></label>
    <div class="otro-wrap${sel.includes("__otra")?" on":""}" id="ow-tool">
      <input type="text" id="otro-tool" placeholder="Escribí cuál" value="${esc(R[q.id+"_otra"]||"")}"></div>
    <label class="opt${nin?" sel":""}" id="ninguna">
      <span class="mark check"></span><span class="opt-txt">${esc(q.ninguna)}</span></label>
  </div>`;
  h += `</div>`;
  return h;
}

/* una pieza del acordeón: estado (pendiente o completa), texto, respuesta elegida */
function itemHtml(n, titulo, resp, done, open, cuerpo){
  return `<div class="item${done?" done":""}${open?" open":""}" data-item="${n}">
    <button type="button" class="item-head" aria-expanded="${open}">
      <span class="estado" title="${done?"Completa":"Pendiente"}"></span>
      <span class="item-txt">${esc(titulo)}<span class="item-resp">${esc(resp)}</span></span>
      <span class="chev"></span>
    </button>
    <div class="item-body">${cuerpo}</div>
  </div>`;
}

function bloqueMatriz(q){
  const vals = R.p8 || {};
  if(UI.p8===undefined) UI.p8 = 1;            // arranca con la primera abierta
  let h = `<div class="matriz-head">${esc(q.head)}</div><div id="acc">`;
  let n = 0;
  q.grupos.forEach(gr=>{
    h += `<div class="grupo">${esc(gr.g)}</div>`;
    gr.filas.forEach(f=>{
      n++;
      const v = vals[n], sabe = v>=1 || !!(UI.p8sabe||{})[n];
      h += itemHtml(n, f, respMatriz(q,v), v!==undefined, UI.p8===n,
        `<div class="escala">
           <button type="button" class="esc${v===0?" sel":""}" data-fila="${n}" data-r="no">${esc(q.escala.no.t)}</button>
           <button type="button" class="esc${sabe?" sel":""}" data-fila="${n}" data-r="si">${esc(q.escala.si.t)}</button>
         </div>
         <div class="uso"${sabe?"":" hidden"}>
           <div class="sub-lbl">${esc(q.escala.usoLbl)}</div>
           <div class="escala tres">${q.escala.uso.map(u=>
             `<button type="button" class="esc${v===u.v?" sel":""}" data-fila="${n}" data-v="${u.v}">${esc(u.t)}</button>`).join("")}</div>
         </div>`);
    });
  });
  h += `</div>
    <div class="field abierta">
      <label class="fl" for="p8-abierta">${esc(q.abierta.label)} <span class="opc">Opcional</span></label>
      <p class="hint">${esc(q.abierta.hint)}</p>
      <input type="text" id="p8-abierta" placeholder="${esc(q.abierta.ph)}" value="${esc(R.p8_abierta||"")}">
    </div>`;
  return h;
}

function respMatriz(q,v){
  if(v===undefined) return "";
  return v===0 ? q.escala.no.t : `${q.escala.si.t} · ${q.escala.uso.find(u=>u.v===v).t}`;
}

function bloqueDetalle(q){
  const lista = herramientasConDetalle();
  R.det = R.det || {};
  if(UI.p14===undefined || UI.p14>lista.length) UI.p14 = 1;
  let h = `<div id="acc">`;
  lista.forEach((name,k)=>{
    const n = k+1, d = R.det[name] || {sup:[]};
    const done = detalleCompleto(name);
    h += itemHtml(n, nombreHerr(name), done?resumenDetalle(name):"", done, UI.p14===n,
      `<div class="sub-lbl">¿Por dónde la usás?</div>
       <div class="chips" data-q="sup">${SUPERFICIES[name].map((s,i)=>
         `<button type="button" class="chip${d.sup.includes(s)?" sel":""}" data-i="${i}">${esc(s)}</button>`).join("")}</div>
       <div class="sub-lbl">¿Con qué cuenta?</div>
       <div class="chips" data-q="cuenta">${CUENTAS.map((c,i)=>
         `<button type="button" class="chip${d.cuenta===i?" sel":""}" data-i="${i}">${esc(c.t)}</button>`).join("")}</div>`);
  });
  return h + `</div>`;
}

/* ---------- interacción ---------- */

function cablear(q){
  const aviso = $("#aviso");
  // corre después de despejar(), que saca la marca del campo tocado
  const limpiar = ()=>setTimeout(()=>{ if(!shell.querySelector(".invalid")) aviso.classList.remove("on") });

  if(q.tipo==="campos"){
    q.campos.forEach((c,i)=>{
      const el = $("#c-"+c.id);
      el.addEventListener("input",()=>{R[c.id]=el.value.trim();limpiar()});
      if(i===0) setTimeout(()=>el.focus(),120);
    });
  }

  if(q.tipo==="texto"||q.tipo==="largo"){
    const el = $("#in");
    el.addEventListener("input",()=>{R[q.id]=el.value.trim();limpiar()});
    setTimeout(()=>{if(q.tipo==="texto")el.focus()},120);
  }

  if(q.tipo==="radio"){
    shell.querySelectorAll(".opt[data-i]").forEach(l=>{
      l.addEventListener("click",()=>{
        const i = +l.dataset.i;
        R[q.id] = i;
        shell.querySelectorAll(".opt[data-i]").forEach(o=>o.classList.remove("sel"));
        l.classList.add("sel");
        shell.querySelectorAll(".otro-wrap").forEach(w=>w.classList.remove("on"));
        if(q.ops[i].otra){
          const w = $("#ow-"+i); w.classList.add("on"); $("#otro-"+i).focus();
        } else {                       // al cambiar de opción, el texto de «Otra» se borra
          R[q.id+"_otra"] = "";
          shell.querySelectorAll('[id^="otro-"]').forEach(x=>x.value="");
        }
        toggleEjemplo(q); limpiar();
      });
    });
  }

  if(q.tipo==="multi" && !q.grupos){
    shell.querySelectorAll(".opt[data-i]").forEach(l=>{
      l.addEventListener("click",()=>{
        const i = +l.dataset.i;
        const arr = R[q.id] = R[q.id]||[];
        const k = arr.indexOf(i);
        if(k>=0){arr.splice(k,1);l.classList.remove("sel")}
        else{arr.push(i);l.classList.add("sel")}
        if(q.ops[i].otra){
          const w = $("#ow-"+i);
          w.classList.toggle("on",arr.includes(i));
          if(arr.includes(i)) $("#otro-"+i).focus(); else { R[q.id+"_otra"]=""; $("#otro-"+i).value="" }
        }
        if(q.ops[i].sigue){
          $("#sg-"+i).classList.toggle("on",arr.includes(i));
          if(!arr.includes(i)){
            delete R[q.ops[i].sigue.id];
            $("#sg-"+i).querySelectorAll(".chip").forEach(c=>c.classList.remove("sel"));
          }
        }
        toggleEjemplo(q); limpiar();
      });
    });
    shell.querySelectorAll(".chips[data-sigue]").forEach(ch=>{
      const s = q.ops[+ch.dataset.sigue].sigue;
      ch.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{
        R[s.id] = +b.dataset.k;
        ch.querySelectorAll(".chip").forEach(x=>x.classList.toggle("sel",x===b));
      }));
    });
  }

  if(q.tipo==="multi" && q.grupos) cablearHerramientas(q);

  if(q.tipo==="matriz"){
    R.p8 = R.p8||{};
    const cont = $("#acc");
    cablearAcordeon(cont,q.id);
    UI.p8sabe = UI.p8sabe || {};
    cont.querySelectorAll(".esc").forEach(b=>{
      b.addEventListener("click",()=>{
        const it = b.closest(".item"), f = +b.dataset.fila, uso = it.querySelector(".uso");
        const resp = ()=>{ it.querySelector(".item-resp").textContent = respMatriz(q,R.p8[f]) };
        if(b.dataset.r==="no"){                 // no sabe qué es: 0, y se cierra
          R.p8[f] = 0; delete UI.p8sabe[f]; uso.hidden = true;
          it.querySelectorAll(".esc").forEach(x=>x.classList.toggle("sel",x===b));
          resp(); completarItem(cont,q.id,it);
        } else if(b.dataset.r==="si"){          // sabe qué es: se abre cuánto lo usa
          UI.p8sabe[f] = true;
          if(R.p8[f]===0) delete R.p8[f];
          it.querySelector('[data-r="no"]').classList.remove("sel");
          b.classList.add("sel"); uso.hidden = false;
          resp(); marcarEstado(it, R.p8[f]!==undefined);
        } else {                                // cuánto lo usa: 1 a 3, y se cierra
          R.p8[f] = +b.dataset.v;
          uso.querySelectorAll(".esc").forEach(x=>x.classList.toggle("sel",x===b));
          resp(); completarItem(cont,q.id,it);
        }
        toggleEjemplo(q); actualizarContador(q);
      });
    });
    $("#p8-abierta").addEventListener("input",e=>R.p8_abierta=e.target.value.trim());
  }

  if(q.tipo==="detalle"){
    const cont = $("#acc"), lista = herramientasConDetalle();
    cablearAcordeon(cont,q.id);
    cont.querySelectorAll(".chip").forEach(b=>{
      b.addEventListener("click",()=>{
        const it = b.closest(".item"), name = lista[+it.dataset.item-1];
        const d = R.det[name] = R.det[name] || {sup:[]};
        const cual = b.parentNode.dataset.q, i = +b.dataset.i;
        if(cual==="sup"){
          const s = SUPERFICIES[name][i], k = d.sup.indexOf(s);
          if(k>=0) d.sup.splice(k,1); else d.sup.push(s);
          b.classList.toggle("sel",k<0);
        } else {
          d.cuenta = i;
          b.parentNode.querySelectorAll(".chip").forEach(x=>x.classList.toggle("sel",x===b));
        }
        const done = detalleCompleto(name);
        it.querySelector(".item-resp").textContent = done ? resumenDetalle(name) : "";
        // se cierra al elegir la cuenta; mientras marca accesos queda abierta
        if(done && cual==="cuenta") completarItem(cont,q.id,it);
        else marcarEstado(it,done);
        actualizarContador(q);
      });
    });
  }

  shell.querySelectorAll('[id^="otro-"]').forEach(el=>{
    el.addEventListener("input",()=>{R[q.id+"_otra"]=el.value.trim()});
  });
  if($("#ej-in")) $("#ej-in").addEventListener("input",e=>R[q.id+"_ejemplo"]=e.target.value.trim());
  toggleEjemplo(q);
}

function cablearHerramientas(q){
  shell.querySelectorAll(".opt.tool").forEach(l=>{
    l.addEventListener("click",()=>{
      const name = l.dataset.name;
      const arr = R[q.id] = R[q.id]||[];
      const k = arr.indexOf(name);
      if(k>=0){arr.splice(k,1);l.classList.remove("sel")}
      else{arr.push(name);l.classList.add("sel");R[q.id+"_ninguna"]=false;$("#ninguna").classList.remove("sel")}
      if(name==="__otra"){
        const w = $("#ow-tool");
        w.classList.toggle("on",arr.includes("__otra"));
        if(arr.includes("__otra")) $("#otro-tool").focus(); else { R[q.id+"_otra"]=""; $("#otro-tool").value="" }
      }
      actualizarContador(q);   // el total de pasos cambia si aparece o se va el detalle
    });
  });
  $("#otro-tool").addEventListener("input",e=>{R[q.id+"_otra"]=e.target.value.trim()});
  $("#ninguna").addEventListener("click",()=>{
    const on = !R[q.id+"_ninguna"];
    R[q.id+"_ninguna"] = on;
    $("#ninguna").classList.toggle("sel",on);
    if(on){
      R[q.id]=[]; R[q.id+"_otra"]=""; $("#otro-tool").value="";
      shell.querySelectorAll(".opt.tool").forEach(o=>o.classList.remove("sel"));
      $("#ow-tool").classList.remove("on");
    }
    actualizarContador(q);
  });
}

/* ---------- acordeón ----------
   Una pieza abierta a la vez. Al completarse, se cierra, queda con el ícono de
   completa y se abre la siguiente pendiente. Cualquier pieza se puede reabrir;
   la que se deja sin responder conserva el ícono de pendiente. */

function abrir(cont,key,n){
  UI[key] = n;
  cont.querySelectorAll(".item").forEach(it=>{
    const on = +it.dataset.item===n;
    it.classList.toggle("open",on);
    it.querySelector(".item-head").setAttribute("aria-expanded",on);
    if(on) requestAnimationFrame(()=>{
      const r = it.getBoundingClientRect();
      if(r.top<100 || r.top>innerHeight*0.55) it.scrollIntoView({behavior:"smooth",block:"start"});
    });
  });
}
function siguientePendiente(cont,desde){
  const pend = [...cont.querySelectorAll(".item:not(.done)")].map(it=>+it.dataset.item);
  return pend.find(x=>x>desde) || pend[0] || null;
}
function cablearAcordeon(cont,key){
  cont.querySelectorAll(".item-head").forEach(b=>b.addEventListener("click",()=>{
    const n = +b.closest(".item").dataset.item;
    abrir(cont,key, UI[key]===n ? null : n);
  }));
}
function marcarEstado(it,done){
  it.classList.toggle("done",done);
  it.querySelector(".estado").title = done ? "Completa" : "Pendiente";
  if(done && it.classList.contains("invalid")){ it.classList.remove("invalid"); avisoAcordeon() }
}
function completarItem(cont,key,it){
  marcarEstado(it,true);
  abrir(cont,key,siguientePendiente(cont,+it.dataset.item));
}

/* El ejemplo nombra la opción que lo pidió. Si esa opción cambia o se desmarca,
   el texto escrito ya no corresponde y se borra. */
function toggleEjemplo(q){
  const box = $("#ej"); if(!box) return;
  let motivo = "", clave = "";
  if(q.tipo==="radio"){
    const i = R[q.id];
    if(i!==undefined && q.ops[i] && !q.ops[i].otra && q.ejemplo.cuando(q.ops[i].v,q.ops[i])){
      motivo = `Marcaste «${q.ops[i].t}».`; clave = "op"+i;
    }
  }
  if(q.tipo==="multi"){
    const arr = (R[q.id]||[]).filter(i=>!q.ops[i].otra);
    const top = arr.reduce((b,i)=>b===null||q.ops[i].v>q.ops[b].v?i:b,null);
    if(top!==null && q.ejemplo.cuando(q.ops[top].v)){
      motivo = `Marcaste «${q.ops[top].t}».`; clave = "op"+top;
    }
  }
  if(q.tipo==="matriz"){
    const filas = q.ejemploFilas.filter(f=>R.p8 && R.p8[f]===3);
    if(filas.length){
      motivo = `Marcaste que usás habitualmente: ${filas.map(f=>q.nombreFila[f]).join(", ")}.`;
      clave = "matriz";
    }
  }
  const antes = box.dataset.clave;
  if(antes && antes!==clave){ R[q.id+"_ejemplo"] = ""; $("#ej-in").value = ""; }
  box.dataset.clave = clave;
  box.querySelector(".why").textContent = motivo;
  box.classList.toggle("on",!!clave);
}

/* ---------- validación ----------
   Cada error se marca en su campo, con el mensaje debajo, y la pantalla va
   hasta el primero. La marca se despeja cuando la persona toca ese campo.
   Obligatorio: todo, salvo las dos abiertas finales y la fila abierta de P8.
   El texto de «Otra» y el ejemplo son obligatorios cuando aparecen. */

const MIN_EJEMPLO = 10;   // caracteres: una línea corta alcanza

function limpiarErrores(){
  shell.querySelectorAll(".invalid").forEach(e=>e.classList.remove("invalid"));
  shell.querySelectorAll(".err").forEach(e=>e.remove());
  $("#aviso").classList.remove("on");
}

function despejar(t){
  const inv = t.closest && t.closest(".invalid");
  if(!inv) return;
  if(inv.classList.contains("item")) return;   // la pieza se despeja al completarse
  inv.classList.remove("invalid");
  const s = inv.nextElementSibling;
  if(s && s.classList.contains("err")) s.remove();
}

/* el aviso del acordeón cuenta en vivo las piezas que siguen marcadas */
function avisoAcordeon(){
  const a = $("#aviso"), n = shell.querySelectorAll(".item.invalid").length;
  if(!n){ a.classList.remove("on"); return }
  const q = visibles()[paso-1];
  const [uno,varios] = q.tipo==="detalle" ? ["herramienta","herramientas"] : ["pregunta","preguntas"];
  a.textContent = n===1
    ? `Queda una ${uno} por completar: está marcada en rojo.`
    : `Quedan ${n} ${varios} por completar: están marcadas en rojo.`;
  a.classList.add("on");
}

function validar(q){
  limpiarErrores();
  const errs = [];
  const marcar = (el,msg)=>{
    if(!el) return;
    el.classList.add("invalid");
    if(msg){
      const d = document.createElement("div");
      d.className = "err"; d.textContent = msg;
      el.insertAdjacentElement("afterend",d);
    }
    errs.push(el);
  };
  const MSG_OTRA = "Escribí cuál es tu otra opción.";

  if(q.tipo==="campos"){
    const nom = R.nombre||"", mail = R.mail||"";
    if(!nom) marcar($("#c-nombre"),"Escribí tu nombre y apellido.");
    else if(nom.split(/\s+/).length<2) marcar($("#c-nombre"),"Sumá tu apellido.");
    if(!mail) marcar($("#c-mail"),"Escribí tu correo.");
    else if(!mail.includes("@")) marcar($("#c-mail"),"Al correo le falta la @.");
    else if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(mail))
      marcar($("#c-mail"),"Revisá el correo: tiene que quedar como nombre@dominio.com.");
    q.campos.filter(c=>c.err).forEach(c=>{
      if((R[c.id]||"").length<2) marcar($("#c-"+c.id),c.err);
    });
  }

  if(q.tipo==="texto" && (R[q.id]||"").length<2)
    marcar($("#in"), q.err||"Completá este campo para seguir.");

  if(q.tipo==="radio"){
    const i = R[q.id];
    if(i===undefined) marcar(shell.querySelector(".opts"),"Elegí una opción para seguir.");
    else if(q.ops[i].otra && !R[q.id+"_otra"]) marcar($("#otro-"+i),MSG_OTRA);
  }

  if(q.tipo==="multi" && !q.grupos){
    const arr = R[q.id]||[];
    const iOtra = q.ops.findIndex(o=>o.otra);
    if(!arr.length) marcar(shell.querySelector(".opts"),"Marcá al menos una opción para seguir.");
    else if(arr.includes(iOtra) && !R[q.id+"_otra"]) marcar($("#otro-"+iOtra),MSG_OTRA);
    arr.forEach(i=>{
      const s = q.ops[i].sigue;
      if(s && R[s.id]===undefined) marcar(shell.querySelector(`.chips[data-sigue="${i}"]`),"Elegí una opción.");
    });
  }

  if(q.tipo==="multi" && q.grupos){
    const arr = R[q.id]||[];
    const marcadas = arr.filter(x=>x!=="__otra").length + (arr.includes("__otra")?1:0);
    if(!marcadas && !R[q.id+"_ninguna"])
      marcar($("#tools-fin"),"Marcá al menos una herramienta, o «Todavía ninguna».");
    if(arr.includes("__otra") && !R[q.id+"_otra"])
      marcar($("#otro-tool"),"Escribí qué otra herramienta usás.");
  }

  // acordeón: se marcan las piezas pendientes y se abre la primera
  if(q.tipo==="matriz" || q.tipo==="detalle"){
    const cont = $("#acc");
    const pend = [...cont.querySelectorAll(".item:not(.done)")];
    pend.forEach(it=>marcar(it));
    if(pend.length){
      const primero = pend[0];
      abrir(cont,q.id,+primero.dataset.item);
      if(q.tipo==="matriz" && (UI.p8sabe||{})[+primero.dataset.item])
        marcar(primero.querySelector(".uso .escala"),"Elegí cuánto lo usás.");
      if(q.tipo==="detalle"){
        const d = (R.det||{})[herramientasConDetalle()[+primero.dataset.item-1]] || {sup:[]};
        if(!d.sup.length) marcar(primero.querySelector('.chips[data-q="sup"]'),"Marcá por dónde la usás.");
        if(d.cuenta===undefined) marcar(primero.querySelector('.chips[data-q="cuenta"]'),"Elegí con qué cuenta la usás.");
      }
      avisoAcordeon();
    }
  }

  // el ejemplo, cuando aparece, es obligatorio
  const ej = $("#ej");
  if(ej && ej.classList.contains("on")){
    const v = R[q.id+"_ejemplo"]||"";
    if(!v) marcar($("#ej-in"),"Escribí el ejemplo para seguir: una línea alcanza.");
    else if(v.length<MIN_EJEMPLO) marcar($("#ej-in"),"Sumá un poco más de detalle: una línea alcanza.");
  }

  if(errs.length){
    const el = errs[0];
    el.scrollIntoView({behavior:"smooth",block:"center"});
    if(el.matches("input,textarea")) el.focus({preventScroll:true});
    return false;
  }
  return true;
}

/* ---------- cálculo ---------- */

function valorRadio(id){
  const i = R[id]; const q = Q.find(x=>x.id===id);
  if(i===undefined || !q.ops[i] || q.ops[i].otra) return 0;   // «Otra» suma 0
  return q.ops[i].v;
}
function opRadio(id){
  const i = R[id]; const q = Q.find(x=>x.id===id);
  return (i===undefined) ? null : q.ops[i];
}
function conEjemplo(id){ return !!(R[id+"_ejemplo"] && R[id+"_ejemplo"].length) }

function calcular(){
  /* --- bloque base --- */
  const frecuencia = valorRadio("p3");

  const qp4 = Q.find(x=>x.id==="p4");
  const marcadas = R.p4||[];
  let profundidad = marcadas.reduce((m,i)=>qp4.ops[i].otra?m:Math.max(m,qp4.ops[i].v),0);
  if(profundidad>=3 && !conEjemplo("p4")) profundidad -= 1;   // sin ejemplo baja un escalón

  let configuracion = valorRadio("p5");
  if(configuracion>=3 && !conEjemplo("p5")) configuracion -= 1;

  const diagnostico = valorRadio("p6");

  let verificacion = valorRadio("p7");
  if(verificacion>=3 && !conEjemplo("p7")) verificacion -= 1;

  const base = frecuencia+profundidad+configuracion+diagnostico+verificacion;

  /* --- matriz --- */
  const filas = {}, m8 = R.p8||{};
  for(let f=1;f<=15;f++) filas[f] = m8[f]||0;
  if(!conEjemplo("p8")) [10,11,12].forEach(f=>{ if(filas[f]===3) filas[f]=2 });
  const sumaMatriz = Object.values(filas).reduce((a,b)=>a+b,0);      // 0 a 45
  const matriz = Math.round((sumaMatriz/3)*100)/100;                  // 0 a 15
  const sumaConfigMatriz = filas[1]+filas[2]+filas[3]+filas[4];       // 0 a 12
  const cerosMatriz = Object.values(filas).filter(v=>v===0).length;

  /* --- continuidad y orden --- */
  let continuidad = valorRadio("p9");
  if(continuidad>=3 && !conEjemplo("p9")) continuidad -= 1;

  const opP10 = opRadio("p10");
  let orden = valorRadio("p10");
  if(opP10 && opP10.alta && !conEjemplo("p10")) orden -= 1;

  const avanzado = matriz+continuidad+orden;
  const total = Math.round((base+avanzado)*100)/100;

  const peldano = PELDANOS.find(p=>total>=p.min && total<=p.max) || PELDANOS[0];

  /* --- banderas --- */
  const opP11 = opRadio("p11");
  const qp15 = Q.find(x=>x.id==="p15");
  const cuentaPersonal = herramientasConDetalle()
    .some(n=>detalleCompleto(n) && CUENTAS[R.det[n].cuenta].personal);
  const datoSensible  = (R.p15||[]).some(i=>qp15.ops[i].sensible);

  const banderas = [];
  if(frecuencia>=3 && configuracion<=1)        banderas.push("intensidad_sin_metodo");
  if(profundidad>=3 && verificacion<=1)        banderas.push("uso_sin_control");
  if(R.p5===0 || cerosMatriz>10)               banderas.push("desconocimiento");
  if(cuentaPersonal && datoSensible)           banderas.push("exposicion");
  if(opP11 && opP11.alta && sumaConfigMatriz<=4) banderas.push("dependencia_sin_arquitectura");
  if(sumaMatriz>=30 && continuidad<=1)         banderas.push("constructor_solitario");

  /* --- siguiente paso ---
     Regla 1: las banderas mandan.
     Regla 2: peldaños 1 y 2 reciben el paso del peldaño; del 3 en adelante,
              el paso sale de la dimensión más floja. */
  const dims = {configuracion,diagnostico,verificacion,continuidad,profundidad,frecuencia};
  const norm = {                        // llevadas a 0-1 para compararlas entre sí
    configuracion:configuracion/4, diagnostico:diagnostico/4, verificacion:verificacion/4,
    continuidad:continuidad/3, profundidad:profundidad/4, frecuencia:frecuencia/4
  };
  let dimFloja = DESEMPATE[0], peor = 2;
  DESEMPATE.forEach(d=>{ if(norm[d] < peor - 1e-9){ peor = norm[d]; dimFloja = d } });

  let origen = "peldano", clave = "peldano_"+peldano.n;
  if(banderas.length && PASO_BANDERA[banderas[0]]){ origen="bandera"; clave=banderas[0] }
  else if(peldano.n>=3 && PASO_DIMENSION[dimFloja]){ origen="dimension"; clave=dimFloja }

  const paso = origen==="bandera" ? PASO_BANDERA[clave]
             : origen==="dimension" ? PASO_DIMENSION[clave]
             : peldano.paso;

  return {frecuencia,profundidad,configuracion,diagnostico,verificacion,base,
          matriz,sumaMatriz,filas,sumaConfigMatriz,cerosMatriz,
          continuidad,orden,avanzado,total,peldano,banderas,
          dimFloja,pasoOrigen:origen,pasoClave:clave,paso};
}

/* ---------- resultado ---------- */

/* Orden: primero se explica el recorrido, después se muestra dónde está la
   persona dentro de él, y al final el paso para llegar al peldaño siguiente.
   El puntaje se muestra como posición, sin número. */
function renderResultado(){
  const r = resultado;
  const p = r.peldano;
  const sig = PELDANOS.find(x=>x.n===p.n+1);
  nav.hidden = true;

  const escalera = PELDANOS.map(x=>`
    <li><span class="lad-sw" style="background:${x.color}"></span>
      <span class="lad-txt"><strong>${x.n} · ${esc(x.nombre)}</strong>
        <span class="lad-desc">${esc(x.describe)}</span></span></li>`).join("");

  const tramos = PELDANOS.map(x=>
    `<div class="tramo${x.n===p.n?" here":""}${sig&&x.n===sig.n?" next":""}" style="flex:${x.max-x.min+1};background:${x.color}"></div>`).join("");
  const nums = PELDANOS.map(x=>
    `<span class="${x.n===p.n?"here":""}" style="flex:${x.max-x.min+1}">${x.n}</span>`).join("");
  const pos = Math.min(98, Math.max(2, r.total/40*100));

  shell.innerHTML = `
  <div style="padding-top:30px">
    <div class="eyebrow">Tu resultado</div>
    <h1>El recorrido de la IA en el trabajo</h1>

    <div class="card">
      <p style="margin:0;color:var(--ink-sec)">Tiene cinco peldaños. Cada persona arranca desde donde está, y cada peldaño tiene su siguiente paso.</p>
      <ol class="escalera">${escalera}</ol>
    </div>

    <div class="card">
      <h3>Dónde estás hoy</h3>
      <div class="posicion">
        <div class="tramos">${tramos}</div>
        <div class="pin" style="left:${pos}%"></div>
        <div class="tramo-nums">${nums}</div>
      </div>
      <p class="donde"><strong>${p.n} · ${esc(p.nombre)}.</strong> ${esc(p.cuerpo)}</p>
    </div>

    <div class="paso">
      <h3>${sig ? `Tu siguiente paso hacia ${esc(sig.nombre)}` : "Tu siguiente paso"}</h3>
      <p>${esc(r.paso)}</p>
    </div>

    <div class="envio" id="envio">Guardando tu respuesta…</div>
  </div>`;

  enviar();
}

/* ---------- envío ---------- */

function payload(){
  const r = resultado;
  const nombreOp = (id,i)=>{const q=Q.find(x=>x.id===id);return (i===undefined||!q.ops[i])?"":q.ops[i].t};
  // la respuesta de una pregunta que se abre va entre paréntesis: «Hacerle preguntas… (Me responde mejor)»
  const listaOps = (id)=>{const q=Q.find(x=>x.id===id);return (R[id]||[]).map(i=>{
    const op = q.ops[i], s = op.sigue;
    return s && R[s.id]!==undefined ? `${op.t} (${s.ops[R[s.id]]})` : op.t;
  }).join(" | ")};

  return {
    timestamp:new Date().toISOString(),
    nombre:R.nombre||"", mail:(R.mail||"").toLowerCase(),
    area:R.area||"", cargo:R.cargo||"",

    p3_frecuencia:nombreOp("p3",R.p3),
    p4_profundidad:listaOps("p4"), p4_otra:R.p4_otra||"", p4_ejemplo:R.p4_ejemplo||"",
    p4_cantidad_tareas:(R.p4||[]).length,
    p5_configuracion:nombreOp("p5",R.p5), p5_otra:R.p5_otra||"", p5_ejemplo:R.p5_ejemplo||"",
    p6_diagnostico:nombreOp("p6",R.p6), p6_otra:R.p6_otra||"",
    p7_verificacion:nombreOp("p7",R.p7), p7_otra:R.p7_otra||"", p7_ejemplo:R.p7_ejemplo||"",

    ...Object.fromEntries(Array.from({length:15},(_,k)=>
      ["p8_f"+String(k+1).padStart(2,"0"), (R.p8||{})[k+1]])),
    p8_suma:r.sumaMatriz, p8_abierta:R.p8_abierta||"", p8_ejemplo:R.p8_ejemplo||"",

    p9_continuidad:nombreOp("p9",R.p9), p9_otra:R.p9_otra||"", p9_ejemplo:R.p9_ejemplo||"",
    p10_orden:nombreOp("p10",R.p10), p10_otra:R.p10_otra||"", p10_ejemplo:R.p10_ejemplo||"",
    p11_autonomia:nombreOp("p11",R.p11), p11_otra:R.p11_otra||"",
    /* por herramienta, en las columnas que ya existen en la hoja:
       «ChatGPT: Navegador, App del celular | Claude: App de escritorio» */
    p12_superficies:detalleTexto("sup"), p12_otra:"",

    p13_herramientas:(R.p13||[]).filter(x=>x!=="__otra").join(" | "),
    p13_otra:R.p13_otra||"", p13_ninguna:!!R.p13_ninguna, p13_mas_usada:"",
    p14_acceso:detalleTexto("cuenta"), p14_otra:"",
    p15_datos:listaOps("p15"), p15_otra:R.p15_otra||"",
    p16_recomendacion:R.p16||"", p17_tarea_deseada:R.p17||"",

    dim_frecuencia:r.frecuencia, dim_profundidad:r.profundidad,
    dim_configuracion:r.configuracion, dim_diagnostico:r.diagnostico,
    dim_verificacion:r.verificacion, puntaje_base:r.base,
    dim_matriz:r.matriz, dim_continuidad:r.continuidad, dim_orden:r.orden,
    puntaje_avanzado:r.avanzado, puntaje_total:r.total,
    peldano_num:r.peldano.n, peldano_nombre:r.peldano.nombre,
    banderas:r.banderas.join(" | "),
    dimension_mas_floja:r.dimFloja,
    paso_origen:r.pasoOrigen, paso_clave:r.pasoClave
  };
}

function detalleTexto(parte){
  return herramientasConDetalle().filter(detalleCompleto).map(n=>{
    const d = R.det[n];
    const v = parte==="sup" ? SUPERFICIES[n].filter(s=>d.sup.includes(s)).join(", ") : CUENTAS[d.cuenta].t;
    return `${nombreHerr(n)}: ${v}`;
  }).join(" | ");
}

async function enviar(){
  const data = payload();
  const box = $("#envio");
  try{ localStorage.setItem("barometro_divino", JSON.stringify(data)) }catch(e){}

  if(!ENDPOINT){
    box.textContent = "Modo local: la respuesta quedó en este navegador.";
    console.log("[barómetro] payload", data);
    return;
  }
  try{
    const res = await fetch(ENDPOINT,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},   // request simple, sin preflight
      body:JSON.stringify(data)
    });
    const j = await res.json().catch(()=>({}));
    if(!res.ok || !j.ok) throw new Error(j.error || res.status);
    box.textContent = "Tu respuesta quedó registrada.";
  }catch(e){
    box.className = "envio err";
    box.textContent = "Tu resultado está calculado y guardado en este navegador. El envío falló: avisale a quien te compartió el link.";
    console.error("[barómetro] envío", e);
  }
}

/* ---------- navegación ---------- */

btnNext.addEventListener("click",()=>{
  const V = visibles();
  if(paso>0 && paso<=V.length && !validar(V[paso-1])) return;
  if(paso===V.length){ resultado = calcular(); paso++; return render() }
  paso++; render();
});
btnBack.addEventListener("click",()=>{ if(paso>0){paso--; render()} });

/* la marca de error se despeja en cuanto la persona toca el campo marcado */
shell.addEventListener("input",e=>despejar(e.target));
shell.addEventListener("click",e=>despejar(e.target));

render();
</script>
